
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pension Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            max-width: 900px;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input {
            padding: 7px;
            width: 180px;
        }

        button {
            margin-top: 18px;
            padding: 9px 18px;
            cursor: pointer;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 25px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: right;
        }

        th {
            background: #eee;
        }

        th:first-child, td:first-child {
            text-align: center;
        }
    </style>
</head>

<body>

<h2>Pension Calculator</h2>

<label>
    Initial pension:
    <input type="number" id="pension" value="300000" min="0">
</label>

<label>
    Annual return (%):
    <input type="number" id="percent" value="5" step="0.1">
</label>

<label>
    Annual withdrawal:
    <input type="number" id="withdrawal" value="20000" min="0">
</label>

<label>
    Starting age:
    <input type="number" id="age" value="62" min="0">
</label>

<label>
    Maximum years:
    <input type="number" id="years" value="30" min="1" max="100">
</label>

<button onclick="calculate()">Calculate</button>

<div id="summary"></div>

<table>
    <thead>
        <tr>
            <th>Year</th>
            <th>Age</th>
            <th>Starting balance</th>
            <th>Interest</th>
            <th>Withdrawal</th>
            <th>Ending balance</th>
        </tr>
    </thead>
    <tbody id="results"></tbody>
</table>

<script>
function calculate() {
    let base = Number(document.getElementById("pension").value);
    const percent = Number(document.getElementById("percent").value);
    const withdrawal = Number(document.getElementById("withdrawal").value);
    let age = Number(document.getElementById("age").value);
    const years = Number(document.getElementById("years").value);

    const results = document.getElementById("results");
    const summary = document.getElementById("summary");

    results.innerHTML = "";
    summary.innerHTML = "";

    if (
        !Number.isFinite(base) ||
        !Number.isFinite(percent) ||
        !Number.isFinite(withdrawal) ||
        !Number.isFinite(age) ||
        !Number.isInteger(years) ||
        base < 0 || percent < 0 ||
        withdrawal < 0 || age < 0 ||
        years < 1 || years > 100
    ) {
        summary.textContent = "Please enter valid values.";
        return;
    }

    let totalWithdrawn = 0;
    let count = 0;

    for (let year = 1; year <= years && base > 0; year++) {
        const startingBalance = base;

        // Interest earned during the year
        const interest = Math.round(
            startingBalance * percent / 100 * 100
        ) / 100;

        // Withdraw no more than the available balance
        const actualWithdrawal = Math.min(
            withdrawal,
            startingBalance + interest
        );

        // End-of-year balance
        base = Math.round(
            (startingBalance + interest - actualWithdrawal) * 100
        ) / 100;

        totalWithdrawn += actualWithdrawal;
        count++;

        const row = document.createElement("tr");

        const values = [
            year,
            age,
            startingBalance,
            interest,
            actualWithdrawal,
            base
        ];

        values.forEach((value, index) => {
            const cell = document.createElement("td");

            cell.textContent = index < 2
                ? value
                : value.toLocaleString("en-US", {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });

            row.appendChild(cell);
        });

        results.appendChild(row);
        age++;
    }

    summary.textContent =
        "Years calculated: " + count +
        " | Total withdrawn: " +
        totalWithdrawn.toLocaleString("en-US", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }) +
        " | Final balance: " +
        base.toLocaleString("en-US", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
}

calculate();
</script>

</body>
</html>
